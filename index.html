function render(){const c=mode==='complete'?null:view[idx],valid=!!c;$('flashcard').hidden=!valid;$('speak').hidden=!valid;$('speechChoice').hidden=!valid||!(flipped?c?.backSpeech:c?.frontSpeech)?.some(x=>x.lang==='ar-EG'||x.lang==='en-US');$('empty').hidden=valid||mode==='complete';$('empty').textContent=valid?'':t.noCards;if(valid){$('cardPrompt').textContent=flipped?c.back:c.front;$('cardPrompt').dir='auto';$('cardType').textContent=t.types[c.type];$('cardChapter').textContent=c.chapter;$('flipHint').textContent=flipped?t.backHint:t.flipHint;$('cardSide').textContent=flipped?t.back:t.front}let done=mode==='review'&&session?session.seen.size:mode==='complete'&&session?session.seen.size:view.filter(c=>rec(c.id).length).length;let total=view.length;$('position').textContent=(valid?idx+1:0)+' / '+total;$('progressValue').textContent=(total?Math.round(done/total*100):0)+'%';$('progressFill').style.width=(total?done/total*100:0)+'%';$('reviewedCount').textContent=cards.filter(c=>rec(c.id).length).length;$('modeLabel').textContent=mode==='study'?t.study:mode==='review'?t.reviewing:t.sessionComplete;$('reviewSessionActions').hidden=mode!=='review';for(let x of ['again','known','next','prev'])$(x).disabled=!valid;$('prev').disabled=!valid||(mode==='review'&&idx===0);$('next').disabled=!valid||(mode==='review'&&idx===view.length-1)}
function localize(){t=tr[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(el=>{const k=el.dataset.t;el.textContent=t[k]||''});$('language').textContent=lang==='en'?'العربية':'English';$('speechChoice').setAttribute('aria-label',t.voiceChoice);$('speechChoice').title=t.voiceChoice;$('chapter').options[0].textContent=t.allChapters;[...$('type').options].forEach(o=>o.textContent=o.value==='all'?t.allTypes:t[o.value]);[...$('reviewGroup').options].forEach(o=>o.textContent=t[o.value]);[...$('reviewSize').options].forEach(o=>{if(o.value==='all')o.textContent=t.allAvailable});render()}
function loadData(){const d=window.DKW_VOCABULARY;if(!d||!Array.isArray(d.words))throw Error('Vocabulary missing');words=d.words;cards=makeCards(words);migrate();$('totalWords').textContent=words.length;$('totalCards').textContent=cards.length;const old=$('chapter').value;$('chapter').replaceChildren(new Option(t.allChapters,'all'));for(const ch of [...new Set(cards.map(c=>c.chapter))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})))$('chapter').add(new Option(ch,ch));if([...$('chapter').options].some(x=>x.value===old))$('chapter').value=old;resetStudy();localize()}
$('flashcard').onclick=()=>{if(!view.length)return;stopSpeech();flipped=!flipped;render()};$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);$('again').onclick=()=>rate(false);$('known').onclick=()=>rate(true);$('chapter').onchange=resetStudy;$('type').onchange=resetStudy;$('reviewSettings').onclick=()=>{$('reviewPanel').hidden=!$('reviewPanel').hidden};$('closeReview').onclick=()=>$('reviewPanel').hidden=true;$('startReview').onclick=startReview;$('endReview').onclick=finishReview;$('returnStudy').onclick=resetStudy;$('reviewAgain').onclick=()=>{$('reviewGroup').value=reviewOptions.group;$('reviewSize').value=reviewOptions.size;startReview()};$('language').onclick=()=>{lang=lang==='en'?'ar':'en';safeStorage.setItem('dkw-lang',lang);localize()};$('theme').onclick=()=>{const dark=document.documentElement.classList.toggle('dark');safeStorage.setItem('dkw-theme',dark?'dark':'light');$('theme').textContent=dark?'☀':'☾'};
if(safeStorage.getItem('dkw-theme')==='dark'){document.documentElement.classList.add('dark');$('theme').textContent='☀'}
function stopSpeech(){if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speakVisible(){
 const c=view[idx];if(!c)return;
 if(!('speechSynthesis' in window)){$('toast').textContent=t.speechUnavailable;return}
 stopSpeech();const sequence=flipped?c.backSpeech:c.frontSpeech;
 if(!sequence||!sequence.length)return;
 const chosen=sequence.find(part=>part.lang===(speechTranslation==='ar'?'ar-EG':'en-US'))||sequence[0];
 const u=new SpeechSynthesisUtterance(chosen.text);u.lang=chosen.lang;u.rate=chosen.lang.startsWith('de')?.88:.94;
 window.speechSynthesis.speak(u);
}
$('speechChoice').value=speechTranslation;
$('speechChoice').onchange=()=>{speechTranslation=$('speechChoice').value;safeStorage.setItem('dkw-voice-translation',speechTranslation);stopSpeech()};
$('speak').onclick=e=>{e.stopPropagation();speakVisible()};
$('resetProgress').onclick=()=>{$('resetDialog').showModal()};
$('resetDialog').addEventListener('close',()=>{if($('resetDialog').returnValue!=='reset')return;
 stopSpeech();history={};save();safeStorage.removeItem(oldKey);resetStudy();$('toast').textContent=t.resetDone
});
$('refresh').onclick=()=>{stopSpeech();window.location.reload()};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;if([' ','ArrowRight','ArrowLeft'].includes(e.key))e.preventDefault();if(e.key===' '){if(!e.repeat)$('flashcard').click()}if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key==='1')rate(false);if(e.key==='2')rate(true)});
try{loadData()}catch(e){console.error(e);$('empty').hidden=false;$('empty').textContent=t.updateError;$('flashcard').hidden=true}
</script>
</body></html>
